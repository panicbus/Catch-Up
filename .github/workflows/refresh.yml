name: Scheduled news refresh

# Runs the news-refresh job on a timer, using GitHub's own free scheduler instead of a paid
# hosting add-on — GitHub Actions scheduling costs nothing (well within the free monthly minutes
# for a repo this size) and needs no billing details, unlike some hosts' cron-job products.
# `workflow_dispatch` also allows triggering a run manually from the Actions tab for testing.

# SCHEDULE TEMPORARILY DISABLED (2026-08-05). Neon cut the database off at its monthly data-transfer
# quota, and this job was the single largest consumer of it (prune() pulled full article rows plus
# the entire read-state table, ~13-14 times per run). Every run since the cutoff has failed anyway.
# Left disabled so it can't resume consuming the moment a quota resets — re-enable by uncommenting
# the two `schedule` lines below, but ONLY after the query fixes are deployed and a new database
# host is live. `workflow_dispatch` stays on, so a run can still be triggered by hand for testing.
on:
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsx server/cron/refresh.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NYTIMES_API_KEY: ${{ secrets.NYTIMES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
